[project]
name = "doc-grounded-archives"
version = "0.1.0"
description = "Local, open-source document-grounded analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "rich>=13.7.1",
]

[project.scripts]
dga = "dga.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
